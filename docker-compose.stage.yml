version: "3.9"

# ── Stage environment ─────────────────────────────────────────────────────────
# Usage:
#   IMAGE_TAG=stage-a1b2c3d docker compose -f docker-compose.stage.yml up -d

networks:
  stage-net:
    external: true

volumes:
  stage-db-data:
  stage-vault-secrets:

services:

  db:
    image: postgres:15-alpine
    container_name: stage-db
    networks: [stage-net]
    environment:
      POSTGRES_USER:     stocks
      POSTGRES_PASSWORD: stocks123
      POSTGRES_DB:       stocksdb
    volumes:
      - stage-db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocks -d stocksdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault-agent:
    image: hashicorp/vault:1.16
    container_name: stage-vault-agent
    networks: [stage-net]
    environment:
      VAULT_ADDR:       ${VAULT_ADDR:-http://vault:8200}
      VAULT_ROLE_ID:    ${APP_VAULT_ROLE_ID}
      VAULT_SECRET_ID:  ${APP_VAULT_SECRET_ID}
    volumes:
      - stage-vault-secrets:/vault/secrets
      - ./vault/agent/agent.hcl:/vault/config/agent.hcl:ro
    command: vault agent -config=/vault/config/agent.hcl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/vault/secrets/.ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  stock-listing:
    image: ${HARBOR_REGISTRY:-myregistry.local:5000}/stocks/stock-listing:${IMAGE_TAG:-latest}
    container_name: stage-stock-listing
    networks: [stage-net]
    depends_on:
      db:
        condition: service_healthy
      vault-agent:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "set -a && . /vault/secrets/db.env && set +a && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - stage-vault-secrets:/vault/secrets:ro
    environment:
      APP_ENV: stage
    ports:
      - "8010:8000"
    restart: unless-stopped
    labels:
      app.service: stock-listing
      app.env:     stage
      app.version: ${IMAGE_TAG:-latest}

  trade:
    image: ${HARBOR_REGISTRY:-myregistry.local:5000}/stocks/trade:${IMAGE_TAG:-latest}
    container_name: stage-trade
    networks: [stage-net]
    depends_on:
      db:
        condition: service_healthy
      vault-agent:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "set -a && . /vault/secrets/db.env && set +a && exec uvicorn app.main:app --host 0.0.0.0 --port 8001"]
    volumes:
      - stage-vault-secrets:/vault/secrets:ro
    environment:
      APP_ENV: stage
    ports:
      - "8011:8001"
    restart: unless-stopped
    labels:
      app.service: trade
      app.env:     stage
      app.version: ${IMAGE_TAG:-latest}
