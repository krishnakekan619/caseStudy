#version: "3.9"

# ─── Shared infrastructure: SonarQube, Trivy, GitHub Runner ──────────
# Start with: docker compose -f docker-compose.infra.yml up -d

networks:
  infra-net:
    external: true
  dev-net:
    external: true
  stage-net:
    external: true
  prod-net:
    external: true

volumes:
  sonarqube-data:
  sonarqube-db-data:
  trivy-cache:
  pip-cache:      # shared pip download cache across all test runs
  sonar-cache:    # sonar-scanner work directory cache (analysis artifacts)

services:

  # ── SonarQube: PostgreSQL backend ────────────────────────────────────────────
  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    networks: [infra-net]
    environment:
      POSTGRES_USER:     sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB:       sonarqube
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SonarQube: Analysis Server ───────────────────────────────────────────────
  sonarqube:
    image: sonarqube:10-community
    container_name: sonarqube
    networks: [infra-net]
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL:      jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - sonarqube-data:/opt/sonarqube/data
    restart: unless-stopped

  # ── Trivy: Image Scanner ─────────────────────────────────────────────────────
  trivy:
    image: aquasec/trivy:0.69.3
    container_name: trivy
    networks: [infra-net]
    volumes:
      - trivy-cache:/root/.cache/trivy
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["tail", "-f", "/dev/null"]   # kept alive; invoked per pipeline step
    restart: unless-stopped

  # ── GitHub Actions Self-Hosted Runner ────────────────────────────────────────
  github-runner:
    image: myoung34/github-runner:latest
    container_name: github-runner
    networks: [infra-net]
    environment:
      RUNNER_NAME:  docker-runner-ks
      REPO_URL:     https://github.com/${GITHUB_ORG}/${GITHUB_REPO}
      ORG_NAME:     ${GITHUB_ORG}
      REPO_NAME:    ${GITHUB_REPO}
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      LABELS:       docker,self-hosted
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
