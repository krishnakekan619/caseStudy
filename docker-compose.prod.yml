#version: "3.9"

# ── Production environment ────────────────────────────────────────────────────
# Usage:
#   IMAGE_TAG=v1.2.0 docker compose -f docker-compose.prod.yml up -d

networks:
  prod-net:
    external: true

volumes:
  prod-db-data:
  prod-vault-secrets:

services:

  db:
    image: postgres:15-alpine
    container_name: prod-db
    networks: [prod-net]
    environment:
      POSTGRES_USER:     stocks
      # DB password in prod is fetched from Vault by vault-agent, not hardcoded here.
      # This initial env var is only used on first container creation.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-REPLACE_WITH_VAULT_VALUE}
      POSTGRES_DB:       stocksdb
    volumes:
      - prod-db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5434:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocks -d stocksdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  vault-agent:
    image: hashicorp/vault:1.16
    container_name: prod-vault-agent
    networks: [prod-net]
    environment:
      VAULT_ADDR:       ${VAULT_ADDR:-http://vault:8200}
      VAULT_ROLE_ID:    ${APP_VAULT_ROLE_ID}
      VAULT_SECRET_ID:  ${APP_VAULT_SECRET_ID}
    volumes:
      - prod-vault-secrets:/vault/secrets
      - ./vault/agent/agent.hcl:/vault/config/agent.hcl:ro
    command: vault agent -config=/vault/config/agent.hcl
    restart: always
    healthcheck:
      test: ["CMD", "test", "-f", "/vault/secrets/.ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  stock-listing:
    image: ${HARBOR_REGISTRY:-myregistry.local:5000}/stocks/stock-listing:${IMAGE_TAG:-latest}
    container_name: prod-stock-listing
    networks: [prod-net]
    depends_on:
      db:
        condition: service_healthy
      vault-agent:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "set -a && . /vault/secrets/db.env && set +a && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - prod-vault-secrets:/vault/secrets:ro
    environment:
      APP_ENV: prod
    ports:
      - "8020:8000"
    restart: always
    labels:
      app.service: stock-listing
      app.env:     prod
      app.version: ${IMAGE_TAG:-latest}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 3

  trade:
    image: ${REGISTRY_URL:-docker.io}/${REGISTRY_NAMESPACE:-stocks}/trade:${IMAGE_TAG:-latest}
    container_name: prod-trade
    networks: [prod-net]
    depends_on:
      db:
        condition: service_healthy
      vault-agent:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "set -a && . /vault/secrets/db.env && set +a && exec uvicorn app.main:app --host 0.0.0.0 --port 8001"]
    volumes:
      - prod-vault-secrets:/vault/secrets:ro
    environment:
      APP_ENV: prod
    ports:
      - "8021:8001"
    restart: always
    labels:
      app.service: trade
      app.env:     prod
      app.version: ${IMAGE_TAG:-latest}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 3
